profile: rybbit-google
workdir: .colors
compute-api-version: 2
provider-compute: google
provider-dns: cloudflare
provider-backend: r2
compute-prevent-destroy: true
compute-require-existing-state: true
compute-ssh-sources: ["0.0.0.0/0"]
compute-http-sources: ["0.0.0.0/0"]

google-project: pocketcontext
google-region: europe-west4
google-zone: europe-west4-b
google-machine-type: n4a-highmem-1
google-boot-disk-type: hyperdisk-balanced
google-nic-type: GVNIC
google-image-project: ubuntu-os-cloud
google-image-family: ubuntu-2404-lts-arm64
google-image-id: projects/ubuntu-os-cloud/global/images/ubuntu-2404-noble-arm64-v20260918
google-subnet-cidr: 10.20.1.0/24
google-boot-disk-size-gb: 100

rybbit-host: rybbit.bigconfig.online
rybbit-disable-signup: false
postgres-image: postgres:17-alpine
clickhouse-image: clickhouse/clickhouse-server:24.8-alpine
redis-image: redis:8.6.4-alpine
rybbit-backend-image: ghcr.io/rybbit-io/rybbit-backend:latest
rybbit-client-image: ghcr.io/rybbit-io/rybbit-client:latest
caddy-image: caddy:2.11.4
postgres-data-dir: /var/lib/rybbit/postgres
clickhouse-data-dir: /var/lib/rybbit/clickhouse
redis-data-dir: /var/lib/rybbit/redis
rybbit-backup-dir: /var/backups/rybbit

rybbit-backup-r2-bucket: rybbit-google-backup
rybbit-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
rybbit-backup-r2-region: auto
rybbit-backup-oncalendar: "*-*-* 02:30:00"
rybbit-backup-retention-days: 7
r2-bucket: rybbit-google-state
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

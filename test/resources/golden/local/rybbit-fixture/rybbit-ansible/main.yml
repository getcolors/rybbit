---
- name: Install production single-node Rybbit analytics stack
  hosts: rybbit
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.wait_for_connection: {connect_timeout: 10, delay: 5, sleep: 5, timeout: 600}
    - ansible.builtin.setup:
  tasks:
    - name: Install Docker and backup tooling
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, rclone, ca-certificates, curl, openssl]
        state: present
        # No cache_valid_time: a fresh droplet ships apt lists old enough to
        # name package versions the archive has already superseded, and the
        # install then fails on a 404 rather than fetching a current index.
        update_cache: true
    - ansible.builtin.systemd_service: {name: docker, enabled: true, state: started}
    - ansible.builtin.file: {path: /opt/rybbit, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/rybbit/postgres", state: directory, mode: "0700"}
    - ansible.builtin.file: {path: "/var/lib/rybbit/clickhouse", state: directory, mode: "0755"}
    - ansible.builtin.file: {path: "/var/lib/rybbit/redis", state: directory, mode: "0700"}
    - ansible.builtin.file: {path: "/var/backups/rybbit", state: directory, mode: "0700"}
    - ansible.builtin.file: {path: /var/lib/rybbit/caddy/data, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: /var/lib/rybbit/caddy/config, state: directory, mode: "0755"}
    - ansible.builtin.file: {path: /var/lib/rybbit/clickhouse-users.d, state: directory, mode: "0755"}
    - name: Install ClickHouse experimental JSON type configuration
      ansible.builtin.copy:
        dest: /var/lib/rybbit/clickhouse-users.d/allow-json.xml
        mode: "0644"
        content: |
          <clickhouse>
              <profiles>
                  <default>
                      <allow_experimental_json_type>1</allow_experimental_json_type>
                      <allow_experimental_object_type>1</allow_experimental_object_type>
                  </default>
              </profiles>
          </clickhouse>
    - name: Generate retained database and auth secrets
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        pg_pwd=$(openssl rand -hex 24)
        ch_pwd=$(openssl rand -hex 24)
        redis_pwd=$(openssl rand -hex 24)
        auth_secret=$(openssl rand -hex 32)
        cat <<EOF > /opt/rybbit/stack.env
        POSTGRES_USER=rybbit
        POSTGRES_DB=rybbit
        POSTGRES_PASSWORD=$pg_pwd
        CLICKHOUSE_USER=default
        CLICKHOUSE_DB=rybbit
        CLICKHOUSE_PASSWORD=$ch_pwd
        REDIS_PASSWORD=$redis_pwd
        BETTER_AUTH_SECRET=$auth_secret
        DOMAIN_NAME=rybbit.example.com
        BASE_URL=https://rybbit.example.com
        DISABLE_SIGNUP=false
        DISABLE_TELEMETRY=true
        EOF
      args: {executable: /bin/bash, creates: /opt/rybbit/stack.env}
      no_log: true
    - ansible.builtin.file: {path: /opt/rybbit/stack.env, mode: "0600", owner: root, group: root}
    - name: Install stack configuration
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - {src: compose.yml, dest: /opt/rybbit/compose.yml}
        - {src: Caddyfile, dest: /opt/rybbit/Caddyfile}
        - {src: backup, dest: /usr/local/sbin/rybbit-backup, mode: "0700"}
      notify: Restart Rybbit stack
    - name: Install backup credentials outside generated and tracked files
      ansible.builtin.copy:
        dest: /etc/rybbit-backup.env
        mode: "0600"
        content: |
          RYBBIT_BACKUP_R2_ACCESS_KEY_ID={{ lookup('env','COLORS_PAR_RYBBIT_BACKUP_R2_ACCESS_KEY_ID') }}
          RYBBIT_BACKUP_R2_SECRET_ACCESS_KEY={{ lookup('env','COLORS_PAR_RYBBIT_BACKUP_R2_SECRET_ACCESS_KEY') }}
      no_log: true
    - name: Install backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rybbit-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Rybbit database and analytics backups
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/rybbit-backup.env
          ExecStart=/usr/local/sbin/rybbit-backup
      notify: Reload systemd
    - name: Install backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/rybbit-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily Rybbit backup
          [Timer]
          OnCalendar=*-*-* 02:30:00
          Persistent=true
          RandomizedDelaySec=300
          [Install]
          WantedBy=timers.target
      notify: Reload systemd
    - ansible.builtin.meta: flush_handlers
    - name: Start Rybbit stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args: {chdir: /opt/rybbit}
      register: compose_up
      changed_when: "'Created' in (compose_up.stdout + compose_up.stderr) or 'Recreated' in (compose_up.stdout + compose_up.stderr) or 'Starting' in (compose_up.stdout + compose_up.stderr)"
    - ansible.builtin.systemd_service: {name: rybbit-backup.timer, enabled: true, state: started}
    - name: Wait for backend health endpoint inside container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - backend
          - wget
          - -qO-
          - http://127.0.0.1:3001/api/health
      args: {chdir: /opt/rybbit}
      register: local_health
      changed_when: false
      retries: 60
      delay: 5
      until: local_health.rc == 0
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service: {daemon_reload: true}
    - name: Restart Rybbit stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args: {chdir: /opt/rybbit}

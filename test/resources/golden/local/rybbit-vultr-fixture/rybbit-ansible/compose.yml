services:
  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Caddy serves HTTP/3 over UDP and advertises it via alt-svc whether or
      # not the port is reachable. Without this publication browsers attempt
      # QUIC, get nothing, and fall back to TCP -- which works, so it surfaces
      # as intermittent slowness rather than an error. The provider firewall
      # opens the same hole.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/rybbit/caddy/data:/data
      - /var/lib/rybbit/caddy/config:/config
    depends_on:
      - backend
      - client
    # Access logs are now on, so bound them: an ingestion endpoint writes a
    # line per request and the default json-file driver never rotates.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks:
      - internal

  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /var/lib/rybbit/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4@sha256:85c434814ac8905e5648027ce926f74ab067edd6aadbccb6c0c165cd3571ea49
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    env_file:
      - stack.env
    volumes:
      - /var/lib/rybbit/clickhouse:/var/lib/clickhouse
      - /var/lib/rybbit/clickhouse-users.d/allow-json.xml:/etc/clickhouse-server/users.d/allow-json.xml:ro
      - /var/lib/rybbit/clickhouse-config.d/rybbit.xml:/etc/clickhouse-server/config.d/rybbit.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /var/lib/rybbit/redis:/data
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.9.0@sha256:5a824932c8b7b16364c8ee132e29d1d9d9574445e0d1f091e6364695e117bd66
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLUSTER_WORKERS=2
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.9.0@sha256:2f6f7cbfd65f50129573b67082148b5bb00c20c04420d74ae133c1fd4dc8ac99
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=https://rybbit.example.com
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

# Desired state for a Vultr keygen-mode test fixture. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials:
#   Vultr           COLORS_PAR_VULTR_API_KEY
#   Cloudflare      COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2     COLORS_PAR_R2_ACCESS_KEY_ID
#                   COLORS_PAR_R2_SECRET_ACCESS_KEY
#   backups in R2   COLORS_PAR_RYBBIT_BACKUP_R2_ACCESS_KEY_ID
#                   COLORS_PAR_RYBBIT_BACKUP_R2_SECRET_ACCESS_KEY

profile: rybbit-vultr-keygen-fixture
workdir: WORKDIR

provider-compute: vultr
provider-dns: cloudflare
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- Rybbit analytics stack -------------------------------------------------

# Rybbit has no first-run bootstrap: with signup disabled nobody can create the
# first account. Leave this false until you have registered, then set it true.
rybbit-disable-signup: false

# Acceptance sends its synthetic pageview here rather than to a real site, so
# converges do not write test rows into your analytics. Created on demand.
rybbit-acceptance-site-domain: colors-acceptance.invalid

rybbit-host: rybbit.example.com

# Pinned official images for multi-container stack
postgres-image: postgres:17-alpine
clickhouse-image: clickhouse/clickhouse-server:24.8-alpine
redis-image: redis:8.6.4-alpine
# :latest resolved 2026-08-17; a moving tag is how the PostHog arm ended up
# with an application and a plugin server built from different commits.
rybbit-backend-image: ghcr.io/rybbit-io/rybbit-backend@sha256:f729f42575bf018ff97e9f36d49200665b99003a14868acbe56a9b32a9ed6ac7
rybbit-client-image: ghcr.io/rybbit-io/rybbit-client@sha256:f384c1f73a0c2fc0794526908a1fdb2ba410a5cdb3f105487af70f067c8f103a
caddy-image: caddy:2.11.4

# Persistent data directories on the host
postgres-data-dir: /var/lib/rybbit/postgres
clickhouse-data-dir: /var/lib/rybbit/clickhouse
redis-data-dir: /var/lib/rybbit/redis
rybbit-backup-dir: /var/backups/rybbit

# --- Backups ----------------------------------------------------------------

rybbit-backup-r2-bucket: rybbit-backup
rybbit-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
rybbit-backup-r2-region: auto
rybbit-backup-oncalendar: "*-*-* 02:30:00"
rybbit-backup-retention-days: 7

# --- Vultr -------------------------------------------------------------------

# No `vultr-name`: the instance is labelled after the profile (Compute Name
# Standard). No `vultr-ssh-keys`: the package generates and owns the machine
# keypair, ~/.ssh/<profile>, and registers it as an account key named after the
# profile (SSH Keypair Standard, keygen mode).
vultr-region: ams
vultr-plan: vc2-2c-4gb
vultr-os-id: 2284

# `hostname` is deliberately not a key: Vultr implements a hostname change as an
# OS reinstall, so the instance attribute is ForceNew. The playbook sets the
# hostname from the profile instead. ssh_key_ids is ForceNew too -- rotate the
# generated key by rebuilding, never by editing a machine whose disk you keep.

# SSH is key-only and used for convergence and recovery. HTTP(S) is public.
# Vultr firewalls are default-deny inbound and model no outbound at all.
vultr-ssh-sources:
  - 0.0.0.0/0
  - "::/0"
vultr-http-sources:
  - 0.0.0.0/0
  - "::/0"

# --- OpenTofu state ----------------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

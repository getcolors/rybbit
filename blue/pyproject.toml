[project]
name = "package-rybbit-blue"
version = "0.1.0"
description = "Blue/Python implementation of the Rybbit package"
requires-python = ">=3.11"
dependencies = [
    "colors-compute-blue",
    "blue",
    "package-once-blue",
]

[tool.uv.sources]
colors-compute-blue = { git = "https://github.com/getcolors/colors-compute.git", rev = "59acb202029ea1061c2c68d0a6ad2bb509eccad4", subdirectory = "blue" }
blue = { git = "https://github.com/getcolors/blue.git", rev = "784018bb586882efbd91affd42139582a40ea1d1" }
package-once-blue = { git = "https://github.com/getcolors/once.git", subdirectory = "blue", rev = "a41c43d244cb57da25b2a0c71f19b4e42a101bea" }

# Keep the SDK pin authoritative across transitive package dependencies.
[tool.uv]
override-dependencies = [
    "blue @ git+https://github.com/getcolors/blue.git@784018bb586882efbd91affd42139582a40ea1d1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/package_rybbit_blue"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
